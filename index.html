<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bootstrap To-Do List</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Optional: Google Font & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container py-5">
    <h1 class="text-center mb-5">My Todo App</h1>

    <!-- Todo Form -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form>
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" placeholder="Enter task title">
          </div>

          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" rows="3" placeholder="Enter description"></textarea>
          </div>

          <div class="row g-3 mb-3">
            <div class="col-md-6">
              <label class="form-label">Due Date</label>
              <input type="date" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Assign to Person (Optional)</label>
              <select class="form-select">
                <option selected>-- Select Person (Optional) --</option>
                <option>John Doe</option>
                <option>Jane Smith</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Attachments</label>
            <input type="file" class="form-control" multiple>
          </div>

          <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-primary">
              <i class="bi bi-plus-lg me-1"></i>Add Todo
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Todo List -->
    <div class="card">
      <div class="card-header bg-light fw-semibold">Todos</div>
      <div class="card-body">
        <div class="border rounded p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h5 class="mb-0 fw-semibold">Example Todo</h5>
            <small class="text-muted">Created: 2025-07-01</small>
          </div>
        </div>
      </div>
    </div>

    <p class="text-muted mb-2">Description goes here</p>
    <div class="mb-2">
      <span class="badge bg-light text-dark border me-2">
        <i class="bi bi-calendar-date me-1"></i> Due: 2025-07-10
      </span>

      <span class="badge bg-primary"><i class="bi bi-person me-1"></i> John Doe</span>
      <span class="badge bg-secondary"><i class="bi bi-paperclip me-1"></i> 2 attachments</span>
    </div>
    <div class="text-end">
      <button class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></button>
      <button class="btn btn-sm btn-outline-success me-1"><i class="bi bi-check-lg"></i></button>
      <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
    </div>
  </div>
  </div>
  </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
